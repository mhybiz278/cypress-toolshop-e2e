# Mirrors .github/workflows/e2e.yml so the framework can drop into a GitLab
# estate unchanged. Same shape, same reasoning: one job boots the application
# and runs the suite against it, because the images are far too large to pull
# once per parallel runner.

stages: [lint, test]

default:
  image: cypress/included:15.21.0
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  CYPRESS_BASE_URL: http://angular-ui:4200
  CYPRESS_API_URL: http://web:80

lint:
  stage: lint
  script: [npm run lint]

e2e:
  stage: test
  services:
    - name: yobasystems/alpine-mariadb:10.6.11
      alias: mariadb
    - name: testsmith/practice-software-testing-sprint5-api
      alias: laravel-api
    - name: testsmith/practice-software-testing-sprint5-ui
      alias: angular-ui
  script:
    - npx cypress run --browser chrome
  after_script:
    - npm run summary
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - cypress/reports/
      - cypress/artifacts/

nightly:
  extends: e2e
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

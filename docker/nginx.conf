# nginx in front of the Laravel API's php-fpm process.
# Adapted from the application's own vhost config so the API is served on the
# same path shape the deployed app uses. Referenced by docker-compose.yml.

server {
    listen 80;
    index index.php index.html;
    server_name toolshop.local;
    root /var/www/public;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }
}

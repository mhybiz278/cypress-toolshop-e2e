# Mirrors .github/workflows/e2e.yml — included so the framework can drop into
# a GitLab estate unchanged.
stages: [lint, api, e2e, report]

default:
  image: cypress/included:14.5.0
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  CYPRESS_BASE_URL: http://frontend:4200
  CYPRESS_API_URL: http://api:8091

lint:
  stage: lint
  script: [npm run lint]

api-contract:
  stage: api
  script:
    - npx cypress run --spec 'cypress/e2e/api/**/*.cy.js' --browser electron
  artifacts:
    when: always
    paths: [cypress/reports/]
    expire_in: 1 week

e2e:
  stage: e2e
  needs: [api-contract]
  parallel:
    matrix:
      - SUITE: [auth, catalogue, cart, checkout, account]
  script:
    - npx cypress run --spec "cypress/e2e/${SUITE}/**/*.cy.js" --browser chrome
  artifacts:
    when: always
    paths:
      - cypress/artifacts/
      - cypress/reports/
    expire_in: 1 week
    reports:
      junit: cypress/reports/junit/*.xml

merge-report:
  stage: report
  when: always
  needs: [e2e]
  script: [npm run report]
  artifacts:
    paths: [cypress/reports/html]
    expire_in: 1 month

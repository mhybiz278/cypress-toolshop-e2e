name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full regression. 17:00 UTC is 05:00 NZST.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tag expression to run, e.g. @smoke or @checkout'
        required: false
        default: ''

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Install dependencies
        run: npm ci

      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Cypress binary
        run: npx cypress install

      # One stack, one job. The application under test is roughly 6 GB of
      # container images; a matrix of five runners would pull all of it five
      # times over and spend more wall-clock on `docker pull` than the whole
      # suite takes to run. The reasoning is written up under "CI" in the README.
      - name: Start the application under test
        run: npm run app:up

      - name: Run the suite
        run: |
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            npx cypress run --browser chrome --expose grepTags="${{ github.event.inputs.tags }}"
          else
            npx cypress run --browser chrome
          fi

      - name: Summarise the run
        if: always()
        run: npm run summary

      - name: Application logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: cypress/reports
          retention-days: 14

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artefacts
          path: cypress/artifacts
          retention-days: 7

      - name: Stop the application under test
        if: always()
        run: npm run app:down

  publish-report:
    name: Publish report
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html-report
          path: report

      - name: Prepare the site
        run: |
          mkdir -p site
          cp report/index.html site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
